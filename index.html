<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06080f" />

    <!--
      Favicons
      Default to Mapvoy's icon (the more visible product). VH home is the
      parent brand but Mapvoy is the public-facing product on this site.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/mapvoy/icon/icon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/mapvoy/icon/icon-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/mapvoy/icon/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/mapvoy/icon/icon-180.png" />

    <!-- Company metadata. The product build exports independent root-route metadata. -->
    <meta name="description" content="Vertex Horizon is the independent product studio behind Mapvoy, the photo travel map for iPhone." />

    <!-- Open Graph / Twitter (per-route updates handled in JS) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vertex Horizon" />
    <meta property="og:image" content="https://www.vertex-horizon.com/mapvoy/media/mapvoy-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mapvoy — Every place in your photos, on a 3D globe." />
    <meta property="og:title" content="Vertex Horizon — Makers of Mapvoy" />
    <meta property="og:description" content="The independent product studio behind Mapvoy, the photo travel map for iPhone." />
    <meta property="og:url" content="https://www.vertex-horizon.com/" />
    <meta name="twitter:title" content="Vertex Horizon — Makers of Mapvoy" />
    <meta name="twitter:description" content="The independent product studio behind Mapvoy, the photo travel map for iPhone." />
    <link rel="canonical" href="https://www.vertex-horizon.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.vertex-horizon.com/mapvoy/media/mapvoy-og.png" />

    <title>Vertex Horizon — Makers of Mapvoy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
